# Keeps milestone stat claims fresh across profiles, from the North Star ratchet.
# Reads public.v_storefront_ratchet (anon-readable; same view the blog consumes —
# single source of truth, no recomputation).
#
#   1. README hero line — edited + committed automatically, ONLY when a displayed
#      milestone changes (git history stays quiet).
#   2. Dev.to bio — Forem API has no self-profile-update endpoint (admin-only),
#      so drift opens/updates a GitHub issue here with paste-ready bio text.
#
# Claims are rounded-DOWN milestones (evidence doctrine) and NEVER downgrade:
# the ratchet cumulative can transiently dip (npm 429s skip backfill windows),
# so a lower milestone is treated as "not crossed yet", not a regression.
#
# Required repo secrets (values are already public — they ship in the blog's
# client bundle — but kept as secrets for hygiene):
#   SUPABASE_URL       — https://<project-ref>.supabase.co
#   SUPABASE_ANON_KEY  — anon JWT
name: Refresh profile stats

on:
  schedule:
    # Daily, late enough to clear daily-impact-ingest even when GitHub delays
    # its 05:00 cron by hours (observed 05:30 -> 17:13 drift, 2026-08-27..30).
    # Weekly meant a crossing could sit unpublished for up to 7 days; the
    # commit step is a no-op when no milestone moved, so extra runs are silent.
    - cron: "0 20 * * *" # 20:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - name: Recompute milestones, edit README, detect Dev.to bio drift
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          node - <<'EOF'
          const fs = require("fs");

          // Milestone formatters: downloads floor to 25K steps below 1M (375K+),
          // 100K steps above it (1.1M+ — 1.05M+ reads as an odometer, not a milestone);
          // followers floor to 500 steps (1.5K+, 2K+, …). parse() inverts them.
          const trim = (x) => String(x).replace(/\.0$/, "");
          const fmtDl = (n) =>
            n >= 1e6 ? `${trim((Math.floor(n / 1e5) / 10).toFixed(1))}M+`
                     : `${Math.floor(n / 2.5e4) * 25}K+`;
          const fmtFo = (n) => `${trim(((Math.floor(n / 500) * 500) / 1e3).toFixed(1))}K+`;
          const parse = (s) => {
            const m = /^([\d.]+)([KM])\+$/.exec(s);
            return m ? +m[1] * (m[2] === "K" ? 1e3 : 1e6) : 0;
          };

          // Article count is exact, not a milestone — 82 is better evidence than
          // "80+". Matches the badge URL (80_articles), its alt text and the prose;
          // still ratchets UP only, so an unpublish never walks the claim back.
          const bumpCount = (text, n) =>
            text.replace(/(\d+)([_ ]articles)/g, (m, cur, tail) => (n > +cur ? `${n}${tail}` : m));

          // Swap the stat token before `label` in `text`, only ratcheting UP.
          const bump = (text, label, token) => {
            const re = new RegExp(String.raw`([\d.]+[KM]\+)(\s*${label})`);
            const m = re.exec(text);
            if (!m || parse(token) <= parse(m[1])) return text;
            return text.replace(re, `${token}$2`);
          };

          const main = async () => {
            const r = await fetch(
              `${process.env.SUPABASE_URL}/rest/v1/v_storefront_ratchet` +
                `?kind=in.(eng_downloads_cumulative,eng_devto_followers,contrib_articles_authored)&select=kind,current_value`,
              { headers: { apikey: process.env.SUPABASE_ANON_KEY } },
            );
            if (!r.ok) throw new Error(`ratchet fetch ${r.status}`);
            const rows = await r.json();
            const val = (k) => rows.find((x) => x.kind === k)?.current_value;
            const downloads = val("eng_downloads_cumulative");
            const followers = val("eng_devto_followers");
            const articles = val("contrib_articles_authored");
            // Fail loudly on missing/implausible data — silent skips go stale.
            if (!downloads || !followers || !articles) throw new Error(`missing ratchet rows: ${JSON.stringify(rows)}`);
            if (downloads < 100_000 || followers < 500) throw new Error("implausibly low values — refusing to edit");
            const dlToken = fmtDl(downloads);
            const foToken = fmtFo(followers);
            console.log(`ratchet: downloads=${downloads} (${dlToken}) followers=${followers} (${foToken}) articles=${articles}`);

            // 1. GitHub README hero line
            const readme = fs.readFileSync("README.md", "utf8");
            let next = bump(readme, "npm downloads", dlToken);
            next = bump(next, "followers", foToken);
            next = bumpCount(next, articles);
            if (next !== readme) {
              fs.writeFileSync("README.md", next);
              console.log("README milestones updated");
            } else console.log("README milestones unchanged");

            // 2. Dev.to bio (read-only API — drift becomes an issue, human pastes)
            const p = await fetch("https://dev.to/api/users/by_username?url=ofri-peretz", {
              headers: { "User-Agent": "ofri-profile-stats" },
            });
            if (!p.ok) return console.log(`dev.to profile fetch ${p.status} — skipping bio check`);
            const summary = (await p.json()).summary ?? "";
            // A bio with NO stat token is invisible to bump() — it would report
            // "up to date" forever and the issue would never open. Treat that as
            // dormant and propose an insert (once — see devto-quiet below).
            const dormant = !/[\d.]+[KM]\+/.test(summary);
            const bio = dormant
              ? `${summary} ${dlToken} npm downloads.`
              : bump(bump(summary, "npm downloads", dlToken), "followers", foToken);
            if (bio !== summary) {
              if (dormant) fs.writeFileSync("devto-quiet", "");
              fs.writeFileSync(
                "devto-drift.md",
                [
                  dormant
                    ? "The Dev.to bio has **no stat tokens**, so the ratchet cannot maintain it (`bump()` is a no-op on it). Add one — suggested wording, reword freely, just keep the token and its label contiguous:"
                    : "The Dev.to bio's stat milestones are behind the ratchet.",
                  "Paste this at https://dev.to/settings/profile → Bio:",
                  "", "```", bio, "```", "",
                  `Ratchet evidence: ${downloads.toLocaleString()} downloads, ${followers.toLocaleString()} followers.`,
                ].join("\n"),
              );
              console.log(dormant ? "dev.to bio dormant (no stat tokens)" : "dev.to bio drift detected");
            } else console.log("dev.to bio: up to date");
          };
          main().catch((e) => { console.error(e); process.exit(1); });
          EOF
      - name: Commit README if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: hero stats milestone crossed"
          git push
      - name: Open issue on Dev.to bio drift
        if: ${{ hashFiles('devto-drift.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Dev.to bio stats stale"
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$num" ]; then
            # Dormant state is unchanging — comment only on real drift, else the
            # issue collects an identical comment every single week.
            [ -f devto-quiet ] || gh issue comment "$num" --body-file devto-drift.md
          else
            gh issue create --title "$title" --body-file devto-drift.md
          fi
